project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"              # CONTENIDOS.md y TODO.md son notas internas, no páginas
    - "problemas/*.qmd"

website:
  title: "Señales y Sistemas Lineales — Prácticas"
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Inicio"
        href: index.qmd
      - text: "Práctica 0 — Introducción a MATLAB"
        href: lab0.qmd
      - text: "Práctica 1 — Conversión AD y DA"
        href: lab1.qmd
      - text: "Práctica 2 — Análisis en el dominio temporal"
        href: lab2.qmd
      - section: "Problemas resueltos"
        contents:
          - text: "Señales y sistemas"
            href: problemas/senales_sistemas.qmd
          - text: "Estabilidad BIBO"
            href: problemas/estabilidad_bibo.qmd
          - text: "Ecuaciones diferenciales y en diferencias"
            href: problemas/ecuaciones_diff.qmd
          - text: "Muestreo, cuantización y aliasing"
            href: problemas/problemas_muestreo.qmd

# --- metadatos y ejecución compartidos por todos los labs ---
lang: es
subtitle: "Señales y Sistemas Lineales"
jupyter: jupyter_matlab_kernel
filters:
  - callouts.lua
  - tikz.lua

execute:
  echo: true
  warning: false
  cache: true
  freeze: auto        # no re-ejecuta MATLAB de un lab sin cambios al construir el sitio

format:
  html:
    toc: true
    toc-title: "Contenido"
    number-sections: true
    code-copy: true
    fig-align: center
  pdf:
    toc: true
    toc-title: "Contenido"
    number-sections: true
    fig-width: 6
    fig-height: 3.5
    fig-align: center
    include-in-header:
      text: |
        \usepackage{fontawesome5}
